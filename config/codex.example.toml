[mcp_servers.tia_openness]
command = 'C:\Dev\tia-codex-bridge\.venv\Scripts\python.exe'
args = [
  '-m', 'tia_bridge',
  '--project-root', 'C:\TIA\Projects',
  '--workspace', 'C:\TIA\BridgeWork',
  '--tia-version', '20',
  '--tia-api-dir', 'C:\Program Files\Siemens\Automation\Portal V20\PublicAPI\V20'

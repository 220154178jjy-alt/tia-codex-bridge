[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tia-codex-bridge"
version = "0.1.0"
description = "Local stdio MCP bridge for Siemens TIA Portal Openness"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = []

[project.optional-dependencies]
windows = ["pythonnet==3.0.5; sys_platform == 'win32'"]

[project.scripts]
tia-codex-bridge = "tia_bridge.__main__:main"

[tool.setuptools.packages.find]
include = ["tia_bridge*"]
